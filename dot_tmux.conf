
# Change prefix from Ctrl-B to Ctrl-A
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

set-option -g renumber-windows on
set -g base-index 1
setw -g pane-base-index 1

# Split panes using | and -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Smart pane switching with awareness of Vim splits (vim-tmux-navigator)
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R

# Resize panes using prefix + hjkl
bind -r h resize-pane -L 5
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5

# Minimal pane borders - clean single line
set -g pane-border-style "fg=#625e5a"
set -g pane-active-border-style "fg=#87a987"
set -g pane-border-status off
set -g pane-border-indicators off
set -g pane-border-lines single
# Remove any window styling that might add visual spacing
set -g window-style "bg=default"
set -g window-active-style "bg=default"

# Removed tmux-kanagawa plugin to avoid conflicts with dotbar
# set -g @plugin 'Nybkox/tmux-kanagawa'
# set -g @kanagawa-theme 'dragon'

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

set -g @plugin 'vaaleyard/tmux-dotbar'

# tmux-dotbar Kanagawa Dragon color configuration
set -g @tmux-dotbar-bg "#181616"               # dragonBlack3 (main background)
set -g @tmux-dotbar-fg "#7a8382"               # dragonGray3 (inactive windows - darker)
set -g @tmux-dotbar-fg-current "#C8C093"       # oldWhite (active window - brighter/warmer)
set -g @tmux-dotbar-fg-session "#87a987"       # dragonGreen (session name/left label)
set -g @tmux-dotbar-fg-prefix "#8ea4a2"        # dragonAqua (prefix indicator)

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
