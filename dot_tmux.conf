set -g base-index 1
set -g pane-base-index 1

unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

set-option -g renumber-windows on

unbind %
bind | split-window -h -c "#{pane_current_path}"
unbind '"'
bind - split-window -v -c "#{pane_current_path}"

unbind r
bind r source-file ~/.tmux.conf

bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5

bind -r m resize-pane -Z

set -g mouse off

# Pane border configuration
set -g pane-border-style "fg=#625e5a"
set -g pane-active-border-style "fg=#87a987"
set -g pane-border-status off
set -g pane-border-indicators off
set -g pane-border-lines double

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# list of tmux plugins
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'vaaleyard/tmux-dotbar'
set -g @plugin 'sainnhe/tmux-fzf'

# tmux-dotbar Kanagawa Dragon color configuration
set -g @tmux-dotbar-bg "#181616"               # dragonBlack3 (main background)
set -g @tmux-dotbar-fg "#7a8382"               # dragonGray3 (inactive windows - darker)
set -g @tmux-dotbar-fg-current "#C8C093"       # oldWhite (active window - brighter/warmer)
set -g @tmux-dotbar-fg-session "#87a987"       # dragonGreen (session name/left label)
set -g @tmux-dotbar-fg-prefix "#8ea4a2"        # dragonAqua (prefix indicator)
set -g @tmux-dotbar-window-status-format " #I #W "

run '~/.tmux/plugins/tpm/tpm'

unbind -n C-\\

setw -g mode-keys vi
